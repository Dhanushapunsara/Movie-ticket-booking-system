spring.application.name=movie-ticket-booking
server.port=8080

# ---------------------------------------------------------------
# MySQL database
# Run database/schema.sql in MySQL Workbench first, then put your
# own MySQL username/password below (or set DB_USERNAME / DB_PASSWORD).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# 'update' keeps the tables created by schema.sql and only adds anything missing.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Don't drop/recreate the named unique constraints that schema.sql already created
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
spring.jackson.time-zone=Asia/Colombo

# ---------------------------------------------------------------
# JWT
# Secret must be a Base64 string of at least 256 bits. Change it for production.
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:bW92aWUtdGlja2V0LWJvb2tpbmctc3lzdGVtLWlqc2UtY21qZC0xMTQtMTE1LXNlY3JldC1rZXk=}
app.jwt.expiration-ms=86400000

# Default admin account created on first start-up (if it doesn't exist)
app.admin.email=admin@movieticket.lk
app.admin.password=Admin@123
app.admin.full-name=System Administrator

# Frontend origin allowed by CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.root=INFO
logging.level.lk.ijse.movieticket=DEBUG
logging.file.name=logs/movie-ticket-booking.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n
